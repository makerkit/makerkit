packages:
  - packages/*
  - packages/data-loader/supabase/*

allowBuilds:
  esbuild: true
  supabase: true

catalog:
  '@modelcontextprotocol/sdk': 1.32.2
  '@remix-run/react': ^2.17.5
  '@supabase/postgrest-js': ^2.119.0
  '@supabase/supabase-js': ^2.119.0
  '@tanstack/react-query': ^5.107.1
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.3
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@upstash/qstash': ^2.12.0
  'jsdom': ^31.0.1
  'next': ^16.4.6
  'react': ^19.3.1
  'react-dom': ^19.3.1
  'ts-case-convert': ^2.3.1
  'tsdown': 0.23.7
  'typescript': ^7.0.2
  'vite': ^8.3.8
  'vitest': ^5.1.0
  'zod': 4.6.7

peerDependencyRules:
  allowedVersions:
    # Remix v2 and tsconfck declare TypeScript ^5 peers; they work with 6.
    typescript: '6'

overrides:
  # One zod (and so one MCP SDK copy) across the repo; keep in sync with the catalog.
  zod: 4.6.5

permissions:
  tsdown:
    skills: true

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
